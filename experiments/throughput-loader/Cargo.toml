[package]
name = "trino-loader"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
env_logger = "0.11.10"
log = "0.4.29"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt", "macros", "net", "rt-multi-thread"] }
