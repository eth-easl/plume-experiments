connector.name=hive

# Use 'thrift' if you have a Hive Metastore, or 'glue' if using AWS Glue
hive.metastore=glue
# Glue config
hive.metastore.glue.region=eu-west-1
hive.metastore.glue.aws-access-key=<PLACEHOLDER>
hive.metastore.glue.aws-secret-key=<PLACEHOLDER>
# Needs to be set if someone else is running these experiments, should be equalt to the 12 number account ID
# hive.metastore.glue.catalogid=<id>

# S3 Configuration
fs.native-s3.enabled=true
s3.region=eu-west-1
s3.aws-access-key=<PLACEHOLDER>
s3.aws-secret-key=<PLACEHOLDER>

# Performance optimization for Parquet
hive.storage-format=PARQUET
hive.compression-codec=SNAPPY

# Cache config
fs.cache.enabled=false
# # on-disk cache
# fs.cache.directories=/tmp/trino-cache
# # # in-memory cache
# fs.cache.directories=/dev/shm/trino-cache
# fs.cache.max-sizes=16GB