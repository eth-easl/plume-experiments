{% if 'master' in group_names %}
coordinator=true
node-scheduler.include-coordinator=false
{% else %}
coordinator=false
{% endif %}
http-server.http.port=8080
discovery.uri=http://{{ hostvars['master_01']['private_dns_name'] }}:8080
query.max-memory-per-node=60%
query.max-memory=1TB
openmetrics.jmx-object-names=trino.*:*|io.trino.filesystem.alluxio:*|org.alluxio:*
{% if trino_tracing_enabled | default(false) | bool %}
tracing.enabled=true
otel.exporter.endpoint={{ trino_otel_exporter_endpoint }}
otel.exporter.protocol={{ trino_otel_exporter_protocol | default('grpc') }}
{% endif %}
shutdown.grace-period=1m